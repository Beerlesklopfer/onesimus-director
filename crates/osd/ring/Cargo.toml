[package]
name = "osd-ring"
description = "Shared-memory block ring of osd: one producer (network session), N consumers (device writers), cross-process wait/wake, request mailbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Eigener Teil, nicht von Bareos abgeleitet: duale Lizenz (docs/LIZENZEN.md)
license = "AGPL-3.0-or-later OR LicenseRef-Onesimus-Commercial"

[dependencies]
aquamarine.workspace = true
memmap2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
