[package]
name = "osd-daemon"
description = "Onesimus Storage Daemon (binary osd) — Rust replacement for the Bareos Storage Daemon; P1: backup, restore and verify on File devices, gRPC (TLS) to odir/ofd, BNET to bareos-dir/bareos-fd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later AND AGPL-3.0-only"

# Package `osd-daemon`, binary `osd` (ofd audit M1/M2: the package name must
# differ from the interface `osd`, the binary name may stay). Pitfalls of
# the layout: `-p osd` means the interface (M3/M4: no daemon tests, no
# binary, no warning); build and package the daemon with `-p osd-daemon`.
[[bin]]
name = "osd"
path = "src/main.rs"
# M9: lib `osd` and bin `osd` would collide in `cargo doc --workspace`
# ("output filename collision"); the daemon's binary is left out of rustdoc.
doc = false

[dependencies]
bareos-bnet.workspace = true
bareos-config.workspace = true
bareos-format.workspace = true
onesimus-bnet-grpc.workspace = true
smartread = { path = "../../smartread" }
daemon-crate.workspace = true
onesimus-proto-rs.workspace = true
osd.workspace = true
osd-ring.workspace = true
clap.workspace = true
libc.workspace = true
nix.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true

[package.metadata.deb]
name = "osd"
maintainer = "Jörg Bernau <contact@onesimus.io>"
copyright = "2026, Joerg Bernau"
license-file = ["../../../packaging/copyright", "0"]
extended-description = """\
Storage Daemon written in Rust, to replace the Bareos Storage Daemon.
Reads /etc/bareos/bareos-sd.d/ config tree (Bareos-compatible).
Development state P1: backup, restore and verify on File devices (active
and passive clients, Bareos volume format, jobs over several volumes);
gRPC with TLS to the Onesimus Director and File Daemon, BNET to
bareos-dir and bareos-fd. The service is installed but neither enabled
nor started.
.
Binary: /usr/sbin/osd
Volume tools: /usr/bin/ols, oscan, oextract (replace bls, bscan and bextract for file Volumes)
Service: osd.service (alias bareos-storage.service)"""
section = "admin"
priority = "optional"
depends = "$auto"
maintainer-scripts = "../../../packaging/osd"
# Not enabled or started until the maintainer switches a host to osd
# (P1 complete: restore since stage 2, gRPC since stage 3).
systemd-units = { unit-name = "osd", unit-scripts = "../../../packaging/osd", enable = false, start = false }
# M7/M8: `target/…` is relative to the workspace, everything else to this
# package directory (three levels below the root).
assets = [
    ["../../../packaging/osd/logrotate", "etc/logrotate.d/onesimus-osd", "644"],
    ["target/release/osd", "usr/sbin/osd", "755"],
    # Volume tools (crates/outils)
    ["target/release/ols", "usr/bin/ols", "755"],
    ["target/release/oscan", "usr/bin/oscan", "755"],
    ["target/release/oextract", "usr/bin/oextract", "755"],
    ["../../../config/bareos-sd.d/**/*.conf", "usr/share/bareos/defaultconfigs/bareos-sd.d/", "644"],
]

[features]
## OpenSSL statisch aus den Quellen (für Cross-Builds wie `i686-unknown-linux-musl`, 32-Bit-Hosts).
vendored-openssl = ["bareos-bnet/vendored-openssl"]
