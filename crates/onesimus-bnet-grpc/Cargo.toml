[package]
name = "onesimus-bnet-grpc"
description = "BNET messages over gRPC with TLS: the shared transport of odir, ofd and osd (FileDaemon and StorageDaemon Control/Data streams as Read/Write of BNET frames)"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Eigener Teil, nicht von Bareos abgeleitet: duale Lizenz (docs/LIZENZEN.md)
license = "AGPL-3.0-or-later OR LicenseRef-Onesimus-Commercial"

[dependencies]
bareos-bnet.workspace = true
onesimus-proto-rs.workspace = true
aquamarine.workspace = true
base64.workspace = true
flume.workspace = true
prost.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Rechnername für das Server-Zertifikat (src/tls.rs `host_name`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
