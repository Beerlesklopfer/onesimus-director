[package]
name = "bareos-format"
description = "Bareos stream and volume format: LStat, Bareos base64, stream ids, file types, message types, BashSpaces, SD job command"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aquamarine.workspace = true
libc.workspace = true

# POSIX-Regex auf Windows (Bareos nutzt dort PCRE2-POSIX; src/posix_regex.rs)
[target.'cfg(windows)'.dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[dev-dependencies]
base64.workspace = true
