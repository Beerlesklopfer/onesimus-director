[package]
name = "onesimus-daemon"
description = "Common daemon frame of ofd and osd: accept loop, TLS-PSK, Director handshake, bandwidth limit, signals, logging, PID file, daemonize, privilege drop, -t, Bareos exit codes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aquamarine.workspace = true
bareos-bnet.workspace = true
bareos-format.workspace = true
ctrlc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# fork/setsid, Signale, uid/gid: nur Unix (Windows: Dienst-Rahmen, src/winservice.rs)
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Anmeldung beim Service Control Manager (src/winservice.rs)
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
