[package]
name = "onesimus-rig"
description = "End-to-end test rig: odir + ofd + bareos-sd (later osd) with a throwaway catalog"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
bareos-bnet.workspace = true
libc.workspace = true
aquamarine.workspace = true
# a stand-in gRPC certificate where no daemon creates one (fallback cases)
rcgen.workspace = true

[dev-dependencies]
# tests/osd.rs: reads back the volume the SD wrote
bareos-format.workspace = true
# tests/ldap_o7.rs: a throwaway plugin CA and a signed OpenLDAP bundle at test time
onesimus-plugins = { path = "../onesimus-plugins", features = ["test-ca"] }
onesimus-proto-rs.workspace = true
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
