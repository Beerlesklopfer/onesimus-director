[package]
name = "oconsole"
description = "Onesimus Console — Drop-in replacement for Bareos bconsole"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-or-later AND AGPL-3.0-only"

[[bin]]
name = "oconsole"
path = "src/main.rs"

[features]
# Exactly one MCP policy is compiled into the binary.
default = ["mcp-production"]
mcp-production = []
mcp-development = []

[dependencies]
bareos-bnet.workspace = true
bareos-config.workspace = true
onesimus-proto-rs.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
tonic.workspace = true
tokio.workspace = true
rustyline.workspace = true
libc.workspace = true
serde_json.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }

rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
http-body-util = "0.1"
rand.workspace = true
bytes = "1"

[package.metadata.deb]
name = "oconsole"
maintainer = "Jörg Bernau <contact@onesimus.io>"
copyright = "2026, Joerg Bernau"
license-file = ["../../packaging/copyright", "0"]
extended-description = """\
Interactive console for the Director with readline,
tab-completion from Director AST, and syntax coloring.
.
Binary: /usr/bin/oconsole
Config: /etc/bareos/oconsole.conf"""
section = "admin"
priority = "optional"
depends = "$auto"
maintainer-scripts = "../../packaging/oconsole"
assets = [
    ["target/release/oconsole", "usr/bin/oconsole", "755"],
    ["../../config/brconsole.conf", "usr/share/bareos/defaultconfigs/oconsole.conf", "644"],
    # written by odir --write-man-pages packaging/man (template packaging/man/src/oconsole.1.in)
    ["../../packaging/man/oconsole.1", "usr/share/man/man1/", "644"],
]
