[package]
name = "oconsole"
description = "Onesimus Console — Drop-in replacement for Bareos bconsole"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "oconsole"
path = "src/main.rs"

[features]
# Exactly one MCP policy is compiled into the binary.
default = ["mcp-production"]
mcp-production = []
mcp-development = []

[dependencies]
bareos-bnet.workspace = true
bareos-proto-rs.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
tonic.workspace = true
tokio.workspace = true
rustyline.workspace = true
libc.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }

rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
rand.workspace = true
