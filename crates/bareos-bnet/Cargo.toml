[package]
name = "bareos-bnet"
description = "BNET wire protocol, TLS, and CRAM-MD5 authentication for Bareos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
bareos-format.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
hmac.workspace = true
md-5.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
hex = "0.4"
socket2 = { version = "0.5", features = ["all"] }
openssl.workspace = true

libc.workspace = true

[features]
## Baut OpenSSL aus den Quellen und linkt es statisch (Cross-Builds, z. B. i686-musl für 32-Bit-Hosts).
vendored-openssl = ["openssl/vendored"]

[dev-dependencies]
serde_json.workspace = true
