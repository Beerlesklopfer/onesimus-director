[package]
name = "smartread"
description = "Reads S.M.A.R.T. health data of ATA/SATA disks (SG_IO, SAT) and NVMe drives on Linux in pure Rust: attributes, thresholds, health status, self test, identity"
version = "0.1.0"
edition.workspace = true
authors = ["Onesimus <contact@onesimus.io>"]
license = "AGPL-3.0-only OR LicenseRef-Onesimus-Commercial"
repository = "https://github.com/Onesimus-io/onesimus-director"
keywords = ["smart", "disk", "health", "ata", "nvme"]
categories = ["hardware-support", "os::linux-apis"]
# the licence for a crates.io release is not decided yet (docs/LIZENZEN.md): no accidental publish
publish = false

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
