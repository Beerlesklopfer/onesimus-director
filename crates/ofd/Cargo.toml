[package]
name = "ofd"
description = "Onesimus File Daemon — Rust rewrite of the Bareos File Daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ofd"
path = "src/main.rs"

[dependencies]
onesimus-plugins = { path = "../onesimus-plugins" }
tonic.workspace = true
tokio.workspace = true
onesimus-proto-rs.workspace = true
onesimus-bnet-grpc.workspace = true
prost.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
bareos-bnet.workspace = true
bareos-format.workspace = true
daemon-crate.workspace = true
bareos-config.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
libc.workspace = true
clap.workspace = true
jiff.workspace = true
walkdir = "2"
flate2 = "1"
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.10"
sha2.workspace = true
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128", "std"] }

# Podman-Plugin (Linux-only: openat2, User-Namespaces, /proc) und die
# POSIX-Schicht; auf Windows nicht gebaut (docs/plans/PORTIERUNG-MACOS-WINDOWS.md)
[target.'cfg(unix)'.dependencies]
onesimus-podman-core = { path = "../onesimus-podman-core" }
nix.workspace = true

# Windows: Zufallspasswort der Vorlage (src/first_start.rs) und das private
# Arbeitsverzeichnis (src/paths.rs ensure_private_dir)
[target.'cfg(windows)'.dependencies]
getrandom = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[dev-dependencies]
rcgen.workspace = true
onesimus-plugins = { path = "../onesimus-plugins", features = ["test-ca"] }
openssl.workspace = true
wat = "1"

[package.metadata.deb]
name = "ofd"
maintainer = "Joerg Bernau <joerg@bernau.family>"
copyright = "2026, Joerg Bernau"
license-file = ["../../packaging/copyright", "0"]
extended-description = """\
File Daemon written in Rust, speaks the Bareos protocol (BNET) and
the Onesimus gRPC protocol.
Reads /etc/bareos/bareos-fd.d/ config tree (Bareos-compatible).
.
Binary: /usr/sbin/ofd
Service: ofd.service (alias bareos-fd.service)"""
section = "admin"
priority = "optional"
depends = "$auto"
conflicts = "bareos-filedaemon"
replaces = "bareos-filedaemon"
provides = "bareos-filedaemon"
maintainer-scripts = "../../packaging/ofd"
systemd-units = { unit-name = "ofd", unit-scripts = "../../packaging/ofd", enable = true, start = true }
assets = [
    ["../../packaging/ofd/logrotate", "etc/logrotate.d/onesimus-ofd", "644"],
    ["target/release/ofd", "usr/sbin/ofd", "755"],
    ["../../config/bareos-fd.d/**/*.conf", "usr/share/bareos/defaultconfigs/bareos-fd.d/", "644"],
    # written by odir --write-man-pages packaging/man (template packaging/man/src/ofd.8.in)
    ["../../packaging/man/ofd.8", "usr/share/man/man8/", "644"],
]
