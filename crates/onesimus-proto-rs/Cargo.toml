[package]
name = "onesimus-proto-rs"
description = "Generated Rust types from the Onesimus gRPC protocol definitions (onesimus-proto)"
version.workspace = true
edition.workspace = true
authors.workspace = true
# generated from all protos, among them the Bareos-near ones (AGPL-3.0-only); the broker protos are
