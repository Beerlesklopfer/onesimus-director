[package]
name = "outils"
description = "Onesimus Volume-Werkzeuge: ols, oscan, oextract (Ersatz für bls, bscan, bextract)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"

[lib]
name = "outils"
path = "src/lib.rs"

[[bin]]
name = "oscan"
path = "src/bin/oscan.rs"

[[bin]]
name = "oextract"
path = "src/bin/oextract.rs"

[[bin]]
name = "ols"
path = "src/bin/ols.rs"

[dependencies]
bareos-format.workspace = true
libc.workspace = true
bareos-config.workspace = true
