[package]
name = "odir"
description = "Onesimus Director — Drop-in replacement for the Bareos Director daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "odir"
path = "src/main.rs"
# Drop-in: /usr/sbin/odir (C++ bareos-dir can stay installed side-by-side)

[features]
# Typed gRPC write/session/restore RPCs (DirectorApi, S-35).
grpc-development = []
# On in every build since 19.11.2026 (decision of the maintainer): the typed
# write RPCs build the same console lines as ExecuteCommand, go through the
# same queue and the same console ACLs, and can answer the known questions.
default = ["grpc-development"]

[dependencies]
bareos-bnet.workspace = true
bareos-format.workspace = true
daemon-crate.workspace = true
bareos-config.workspace = true
bareos-catalog.workspace = true
onesimus-proto-rs.workspace = true
onesimus-bnet-grpc.workspace = true
bareos-orm = { path = "../bareos-orm" }
osd = { path = "../osd" }

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
crossbeam-channel.workspace = true
flume.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
nix.workspace = true
rustls.workspace = true
libc.workspace = true
clap.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
socket2 = { version = "0.5", features = ["all"] }
sqlx.workspace = true
rcgen.workspace = true
mdns-sd.workspace = true
# PAM login of consoles with `Use Pam Authentication = yes` (S-43); MPL-2.0 is
# compatible with AGPL-3.0. Build needs libpam0g-dev, the package libpam0g ($auto).
pam-client2 = { version = "0.5.6", default-features = false }
hex.workspace = true
rustls-pki-types.workspace = true
md-5.workspace = true
rand.workspace = true
openssl.workspace = true

[dev-dependencies]
# tests/grpc_typed_api.rs (tonic client with pinned TLS)
prost-types.workspace = true
tokio-rustls.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }
bytes = "1"

[package.metadata.deb]
name = "odir"
maintainer = "Joerg Bernau <joerg@bernau.family>"
copyright = "2026, Joerg Bernau"
license-file = ["../../packaging/copyright", "0"]
extended-description = """\
High-performance Director daemon written in Rust.
Reads /etc/bareos/bareos-dir.d/ config tree (Bareos-compatible).
.
Binary: /usr/sbin/odir"""
section = "admin"
priority = "optional"
depends = "$auto"
breaks = "onesimusd (<< 0.25.0-3~), onesimus-dird"
replaces = "onesimusd (<< 0.25.0-3~), onesimus-dird"
maintainer-scripts = "../../packaging/odir"
systemd-units = { unit-name = "odir", unit-scripts = "../../packaging/odir", enable = true, start = true }
assets = [
    ["../../packaging/odir/logrotate", "etc/logrotate.d/onesimus-odir", "644"],
    ["target/release/odir", "usr/sbin/odir", "755"],
    ["../bareos-orm/schema/*.json", "usr/lib/bareos/scripts/ddl/", "644"],
    ["../../config/bareos-dir.d/**/*.conf", "usr/share/bareos/defaultconfigs/bareos-dir.d/", "644"],
    # man pages generated from the console grammar (odir --write-man-pages packaging/man)
    ["../../packaging/man/odir.8", "usr/share/man/man8/", "644"],
    ["../../packaging/man/odir-*.7", "usr/share/man/man7/", "644"],
]
