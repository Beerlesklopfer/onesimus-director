# Profile of the AI assistant console (oconsole --mcp logs in as its own
# Console "<name>-mcp"): read access plus configuration changes.
#
# Grant it to the assistant's console, e.g.
#   Console { Name = admin-mcp; Password = "..."; Profile = assistant }
# and add further commands (run, restore, cancel …) to that Console only
# when the assistant should have them.
#
# Whatever this profile or the Console says, the Director refuses for every
# console named "*-mcp": ACL changes (.acl/.profile, configure add console)
# and raw SQL (sqlquery, .sql, query), so an assistant can neither lift its
# own limits nor read stored contents (catalog RestoreObject).
Profile {
  Name = assistant
  Description = "AI assistant (oconsole --mcp): read and configure, no ACL changes"
  Command ACL = status, show, list, llist, messages, version, time, help, whoami, estimate
  Command ACL = .help, .status, .api, .grammar, .authorized, .defaults, .levels, .types, .jobstatus, .volstatus, .actiononpurge
  Command ACL = .clients, .jobs, .pools, .storage, .filesets, .schedule, .catalogs, .jobdefs, .locations, .media, .mediatypes, .messages, .msgs
  Command ACL = .sqltables, .sqlschema, .sqlcount
  Command ACL = .bvfs_get_jobids, .bvfs_lsdirs, .bvfs_lsfiles, .bvfs_versions, .bvfs_update
  Command ACL = .ovfs_status, .ovfs_latest, .ovfs_tree, .ovfs_ls, .ovfs_versions
  Command ACL = configure, .config
  Job ACL = *all*
  Client ACL = *all*
  Storage ACL = *all*
  Schedule ACL = *all*
  Pool ACL = *all*
  FileSet ACL = *all*
  Catalog ACL = *all*
}
