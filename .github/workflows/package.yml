# Tests und Debian-Pakete.
#   test    – cargo test der Workspace-Crates (Director, Konsole, Konfiguration, FD)
#   package – nur wenn test grün ist: cargo-deb auf Debian 13 (trixie),
#             Pakete odir, ofd und oconsole als Artefakt; bei einem Tag v*
#             zusätzlich an ein GitHub-Release gehängt.
# Die Paritätsprüfung gegen den Original-Director (tests/parity, ci/local-ci.py)
# braucht Bareos, PostgreSQL und laufende FD/SD und bleibt in der lokalen CI.
name: Paket

on:
  push:
    branches: [development, main]
    tags: ["v*"]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -q >/dev/null
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git build-essential pkg-config protobuf-compiler libprotobuf-dev \
            libssl-dev zlib1g-dev liblzo2-dev libacl1-dev >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install cargo-deb --locked

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-

      - name: Tests
        run: |
          cargo test --locked \
            -p odir -p oconsole -p bareos-config -p ofd -p onesimus-plugins \
            --no-default-features --features oconsole/mcp-production

      # Entwicklungs-Build der typisierten gRPC-API (S-35): nur Tests, die
      # Pakete bleiben Produktions-Builds
      - name: Tests gRPC-Entwicklungs-Build
        run: |
          cargo test --locked -p odir --features grpc-development

  package:
    needs: test
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -q >/dev/null
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git build-essential \
            pkg-config protobuf-compiler libprotobuf-dev libssl-dev >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: package-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-

      - name: Versionsnummer
        # Tags v* bauen die Version aus Cargo.toml. Alle anderen Läufe bekommen
        # eine Build-Nummer: <Version>+dev<Lauf>.g<Commit>.
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="odir"))')
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${base}"; else
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            version="${base}+dev${GITHUB_RUN_NUMBER}.g$(git rev-parse --short=8 HEAD)"
          fi
          echo "DEB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Paketversion: $version"

      - name: Pakete bauen
        # Die Tests liefen im Job test.
        run: |
          cargo build --release --locked -p odir -p ofd -p oconsole --no-default-features --features oconsole/mcp-production
          mkdir -p dist
          for p in odir ofd oconsole; do
            cargo deb -p "$p" --no-build --deb-version "$DEB_VERSION" --output dist/
          done
          ls -l dist

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: onesimus-debs-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apt-get install -y -q --no-install-recommends gh >/dev/null 2>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              > /etc/apt/sources.list.d/github-cli.list
            apt-get update -q >/dev/null && apt-get install -y -q gh >/dev/null
          }
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber
