# Tests und Debian-Pakete.
#   test    – cargo test der Workspace-Crates (Director, Konsole, Konfiguration, FD,
#             BNET-Protokoll, Katalog-ORM, bareos-format, onesimus-daemon,
#             Testgerüst ohne --ignored) und cargo doc der neuen Crates
#   package – nur wenn test grün ist: cargo-deb auf Debian 13 (trixie),
#             Pakete odir, ofd und oconsole als Artefakt; bei einem Tag v*
#             zusätzlich an ein GitHub-Release gehängt.
# Die Paritätsprüfung gegen den Original-Director (tests/parity, ci/local-ci.py)
# braucht Bareos, PostgreSQL und laufende FD/SD und bleibt in der lokalen CI.
name: Paket

on:
  push:
    branches: [development, main]
    tags: ["v*"]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -q >/dev/null
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git build-essential pkg-config protobuf-compiler libprotobuf-dev \
            libssl-dev zlib1g-dev liblzo2-dev libacl1-dev libpam0g-dev >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install cargo-deb cargo-deny --locked

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-

      # Die Tests laufen als unprivilegierter Benutzer: der Job-Container
      # läuft als root, die Broker-, LDAP- und Podman-Tests von ofd prüfen
      # aber gerade, dass nichts als root läuft (ein Broker läuft nie als
      # root; die Konten-Policy darf UID 0 nicht doppelt sehen). Als root
      # scheiterten seit dem 20.11.2026 jeder Lauf an denselben 16 Tests.
      - name: Testbenutzer
        run: |
          useradd --create-home --shell /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"
          echo "AS_CI=runuser -u ci -- env HOME=/home/ci CARGO_HOME=$HOME/.cargo RUSTUP_HOME=$HOME/.rustup PATH=$HOME/.cargo/bin:/usr/bin:/bin" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          $AS_CI cargo test --locked \
            -p odir -p oconsole -p bareos-config -p ofd -p onesimus-plugins \
            -p bareos-bnet -p bareos-orm \
            -p bareos-format -p onesimus-daemon -p onesimus-rig -p osd -p osd-daemon -p osd-ring \
            -p onesimus-bnet-grpc \
            --no-default-features --features oconsole/mcp-production

      # Lizenzen, bekannte Schwachstellen (RustSec) und Quellen der Abhängigkeiten
      # (deny.toml). Eine bekannte Schwachstelle lässt den Lauf scheitern;
      # Ausnahmen stehen mit Begründung in deny.toml.
      - name: Abhängigkeiten
        run: $AS_CI cargo deny --locked check

      # Dokumentationsregel (docs/wiki/dokumentation.md): die neuen Crates
      # bauen ihre Doku samt privater Elemente ohne Warnung. Das Testgerüst
      # (onesimus-rig, --ignored) braucht bareos-sd und initdb und läuft lokal.
      - name: Doku neue Crates
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          $AS_CI cargo doc --locked --no-deps --document-private-items \
            -p bareos-format -p onesimus-daemon -p onesimus-rig -p osd -p osd-daemon -p osd-ring \
            -p onesimus-bnet-grpc

      # Entwicklungs-Build der typisierten gRPC-API (S-35): nur Tests, die
      # Pakete bleiben Produktions-Builds
      - name: Tests gRPC-Entwicklungs-Build
        run: |
          $AS_CI cargo test --locked -p odir --features grpc-development

  package:
    needs: test
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
      id-token: write       # Attestierung: keyloses Signieren über OIDC
      attestations: write
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -q >/dev/null
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git build-essential python3 \
            pkg-config protobuf-compiler libprotobuf-dev libssl-dev zlib1g-dev liblzo2-dev libacl1-dev \
            libpam0g-dev >/dev/null
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # python3: Versionsnummer; cargo-deb: der Paketjob ist ein frischer Container
          "$HOME/.cargo/bin/cargo" install cargo-deb cargo-cyclonedx --locked

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: package-${{ hashFiles('Cargo.lock') }}
          restore-keys: package-

      - name: Versionsnummer
        # Tags v* bauen die Version aus Cargo.toml. Alle anderen Läufe bekommen
        # eine Build-Nummer: <Version>+dev<Lauf>.g<Commit>.
        run: |
          base=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="odir"))')
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${base}"; else
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            version="${base}+dev${GITHUB_RUN_NUMBER}.g$(git rev-parse --short=8 HEAD)"
          fi
          echo "DEB_VERSION=$version" >> "$GITHUB_ENV"
          echo "Paketversion: $version"

      - name: Pakete bauen
        # Die Tests liefen im Job test.
        run: |
          cargo build --release --locked -p odir -p ofd -p oconsole --no-default-features --features oconsole/mcp-production
          mkdir -p dist
          for p in odir ofd oconsole; do
            cargo deb -p "$p" --no-build --deb-version "$DEB_VERSION" --output dist/
          done
          ls -l dist

      # Software-Stückliste (CycloneDX 1.5, JSON) je Programm, aus demselben
      # Stand und mit denselben Features wie die Pakete; CRA Anhang I Teil II
      # Nr. 1. Sie liegt neben den Paketen im Artefakt und im Release.
      - name: SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries \
            --no-default-features --features oconsole/mcp-production
          mkdir -p dist/sbom
          for p in odir ofd oconsole; do
            cp "crates/$p/${p}_bin.cdx.json" "dist/sbom/$p.cdx.json"
          done
          ls -l dist/sbom

      # Signatur ohne eigenen Schlüssel: GitHub signiert Herkunft (Repository,
      # Commit, Workflow-Lauf) und Stückliste je Paket mit einem kurzlebigen
      # Zertifikat und trägt sie in das öffentliche Sigstore-Transparenzlog ein.
      # Prüfen: gh attestation verify <paket>.deb -R Beerlesklopfer/onesimus-director
      # Nicht bei Pull Requests (ohne Schreibrechte kein OIDC-Token).
      - name: Herkunft der Pakete signieren
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.deb

      - name: SBOM odir an das Paket binden und signieren
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/odir_*.deb
          sbom-path: dist/sbom/odir.cdx.json

      - name: SBOM ofd an das Paket binden und signieren
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/ofd_*.deb
          sbom-path: dist/sbom/ofd.cdx.json

      - name: SBOM oconsole an das Paket binden und signieren
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/oconsole_*.deb
          sbom-path: dist/sbom/oconsole.cdx.json

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: onesimus-debs-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apt-get install -y -q --no-install-recommends gh >/dev/null 2>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              -o /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              > /etc/apt/sources.list.d/github-cli.list
            apt-get update -q >/dev/null && apt-get install -y -q gh >/dev/null
          }
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.deb dist/sbom/*.json --clobber
