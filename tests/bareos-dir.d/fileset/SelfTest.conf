# Identical to the Bareos default configuration (bareos-director 25.1.3, defaultconfigs/bareos-dir.d).
FileSet {
  Name = "SelfTest"
  Description = "fileset just to backup some files for selftest"
  Include {
    Options {
      Signature = XXH128 # calculate checksum per file
    }
    File = "/usr/sbin"
  }
}
