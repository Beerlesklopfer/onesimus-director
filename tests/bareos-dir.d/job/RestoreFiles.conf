# Identical to the Bareos default configuration (bareos-director 25.1.3, defaultconfigs/bareos-dir.d).
Job {
  Name = "RestoreFiles"
  Description = "Standard Restore template. Only one such job is needed for all standard Jobs/Clients/Storage ..."
  Type = Restore
  Client = bareos-fd
  FileSet = "LinuxAll"
  Storage = File
  Pool = Incremental
  Messages = Standard
  Where = /tmp/bareos-restores
  Maximum Concurrent Jobs = 10
}
