# slapd.conf test (ldapcheck)
include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/nis.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /etc/ldap/schema/local/onesimus.schema

pidfile         /run/slapd/slapd.pid
argsfile        /run/slapd/slapd.args
loglevel        none
modulepath      /usr/lib/ldap
moduleload      back_mdb
moduleload      memberof
moduleload      ppolicy
moduleload      syncprov
moduleload      back_ldap
moduleload      back_meta

TLSCertificateFile    /etc/ldap/tls/server.crt
TLSCertificateKeyFile /etc/ldap/tls/server.key
TLSCACertificateFile  /etc/ldap/tls/ca.crt

database config
access to * by dn.exact=gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth manage by * break

database        mdb
maxsize         1073741824
suffix          "dc=example,dc=com"
rootdn          "cn=admin,dc=example,dc=com"
rootpw          {SSHA}mzk4xLlCA0uZhM9pGxDsMizeHI7GpkgQ
directory       /srv/ldap/main
index           objectClass eq
index           uid,cn eq
index           entryCSN,entryUUID eq
overlay memberof
overlay ppolicy
ppolicy_default "cn=default,ou=policies,dc=example,dc=com"
overlay syncprov
syncprov-checkpoint 100 10
access to attrs=userPassword
        by self write
        by anonymous auth
        by * none
access to *
        by * read

database        mdb
maxsize         104857600
suffix          "o=zweit,c=de"
rootdn          "cn=admin,o=zweit,c=de"
rootpw          {SSHA}mzk4xLlCA0uZhM9pGxDsMizeHI7GpkgQ
directory       /srv/ldap/zweit
access to * by users read

database        meta
suffix          "dc=remote,dc=test"
uri             "ldap://127.0.0.1:3899/dc=remote,dc=test"
idassert-bind   bindmethod=simple binddn="cn=admin,o=zweit,c=de" credentials=MetaSecret-4711 mode=none
