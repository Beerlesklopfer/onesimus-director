# NDMP storage without PairedStorage for the C-050 protocol branches
# (test-only password). Same address and port as File (see ParityNdmp.conf).
# No Username: NdmpBuildStorageJob() fails in fill_ndmp_agent_config()
# before any NDMP connection is made.
Storage {
  Name = ParityNdmpNative
  Protocol = NDMPv2
  Address = WS-JOERG.intranet.bernau.family
  Password = "parity-ndmp-pw"
  Device = FileStorage
  Media Type = File
}
