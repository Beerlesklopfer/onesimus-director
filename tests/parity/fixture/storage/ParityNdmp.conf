# NDMP storage for the C-050 protocol branches (test-only password).
# Same address and port as File: `status all` (DoAllStatus) keeps one storage
# per address:port, so it never adds an NDMP session. PairedStorage = File
# makes `status storage` and `label` use the native storage daemon.
Storage {
  Name = ParityNdmp
  Protocol = NDMPv4
  AuthType = Clear
  Address = WS-JOERG.intranet.bernau.family
  Password = "parity-ndmp-pw"
  Device = FileStorage
  Media Type = File
  PairedStorage = File
}
