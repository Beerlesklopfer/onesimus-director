# Restricted console for resource-ACL listing parity cases, compatibility
# log C-025 (test-only password). Job/Pool/FileSet/Storage/Client ACLs are
# set directly (negation, regex, literal); Schedule/Catalog come from the
# profile parity-acl.
Console {
  Name = parity-acl
  Password = "parity-acl-pw"
  CommandACL = .api, .jobs, .jobdefs, .pools, .storages, .clients, .catalogs, .filesets, .schedule, .consoles, .profiles, .users, .msgs, .mediatypes, run, enable, disable, estimate, whoami
  JobACL = !BackupCatalog, *all*
  PoolACL = "Inc.*", Full
  FileSetACL = !Catalog, *all*
  StorageACL = !File
  ClientACL = bareos-fd
  Profile = parity-acl
}
