# S-07 / C-058: RunScripts of Admin jobs (Director-side only, no daemon
# contact). Shell commands are /bin/echo and /bin/sh; console commands
# only read.
Job {
  Name = "parity-admin-rs"
  Type = Admin
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Incremental
  Messages = Standard
  RunBeforeJob = "/bin/echo before id=%i job=%j name=%n client=%c level=%l type=%t exit=%e dir=%d fs=%f pool=%p store=%w x=%x C=%C v=%v s=%s r=%r F=%F b=%b B=%B pct=%% q=%q"
  RunAfterJob = "/bin/echo after exit=%e F=%F b=%b"
  RunAfterFailedJob = "/bin/echo afterfailed exit=%e"
  ClientRunBeforeJob = "/bin/echo client before"
  RunScript {
    RunsWhen = Before
    RunsOnClient = no
    Console = ".pools"
    Command = "/bin/sh -c 'echo line1; echo \"  line2  \"'"
  }
  RunScript {
    RunsWhen = After
    Console = "wait"
    Console = "nosuchcommand"
  }
  RunScript {
    RunsWhen = Always
    RunsOnClient = no
    FailJobOnError = no
    Command = "/bin/sh -c 'exit 3'"
  }
}
Job {
  Name = "parity-admin-rs-fail"
  Type = Admin
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Incremental
  Messages = Standard
  RunBeforeJob = "/bin/sh -c 'echo failing; exit 2'"
  RunBeforeJob = "/bin/echo second before"
  RunAfterJob = "/bin/echo after exit=%e"
  RunAfterFailedJob = "/bin/echo afterfailed exit=%e"
  RunScript {
    RunsWhen = After
    RunsOnFailure = yes
    RunsOnClient = no
    Console = ".storages"
  }
}
Job {
  Name = "parity-admin-rs-noerr"
  Type = Admin
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Incremental
  Messages = Standard
  RunScript {
    RunsWhen = Before
    RunsOnClient = no
    FailJobOnError = no
    Command = "/nonexistent/prog arg"
  }
  RunScript {
    RunsWhen = Before
    RunsOnClient = no
    Console = "nosuchcommand"
  }
  RunAfterJob = "/bin/echo after exit=%e"
  RunAfterFailedJob = "/bin/echo afterfailed exit=%e"
}
