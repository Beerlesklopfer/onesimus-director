# C-043: one job of every non-backup type for the run dialogs
# (DisplayJobParameters/ModifyJobParameters per job type). No Schedule:
# these jobs are only ever displayed and declined, never run.
Job {
  Name = "parity-admin"
  Type = Admin
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Incremental
  Messages = Standard
}
Job {
  Name = "parity-verify"
  Type = Verify
  Level = VolumeToCatalog
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Incremental
  Messages = Standard
  Verify Job = "backup-bareos-fd"
}
Job {
  Name = "parity-copy"
  Type = Copy
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Full
  Next Pool = Scratch
  Selection Type = PoolUncopiedJobs
  Messages = Standard
}
Job {
  Name = "parity-migrate"
  Type = Migrate
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Full
  Next Pool = Scratch
  Selection Type = Job
  Selection Pattern = "nomatch"
  Messages = Standard
}
Job {
  Name = "parity-consolidate"
  Type = Consolidate
  Client = bareos-fd
  FileSet = "SelfTest"
  Storage = File
  Pool = Incremental
  Messages = Standard
}
Job {
  Name = "parity-restore-regex"
  Type = Restore
  Client = bareos-fd
  FileSet = "LinuxAll"
  Storage = File
  Pool = Incremental
  Messages = Standard
  Regex Where = "!/!/tmp/rx/!"
  Replace = IfNewer
  Bootstrap = "/nonexistent/parity-c043.bsr"
}
