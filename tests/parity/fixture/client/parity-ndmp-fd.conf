# NDMP client for the C-050 protocol branches (test-only password).
# Same address and port as bareos-fd: `status all` (DoAllStatus) keeps one
# client per address:port. No Username: the NDMP status query stops in
# fill_ndmp_agent_config() before any connection is made.
Client {
  Name = parity-ndmp-fd
  Protocol = NDMPv4
  Address = localhost
  Password = "parity-ndmp-pw"
}
