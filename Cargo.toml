[workspace]
resolver = "2"
members = [
    "crates/bareos-bnet",
    "crates/bareos-config",
    "crates/bareos-catalog",
    "crates/bareos-proto-rs",
    "crates/onesimus-dird",
    "crates/oconsole",
    "crates/bareos-orm",
    "crates/bareos-stored",
    "crates/bareos-filed",
]

# bareos-plugins requires python3-dev: cargo build -p bareos-plugins
[workspace.metadata.optional-members]
plugins = ["crates/bareos-plugins"]

[workspace.package]
version = "0.25.0"
edition = "2024"
authors = ["Joerg Bernau <joerg@bernau.family>"]
license = "AGPL-3.0"
repository = "https://github.com/Beerlesklopfer/onesimus-director"

[workspace.dependencies]
# Async runtime (only for gRPC)
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }

# Parsing
nom = "7"

# Crypto
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"

# TLS
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"

# TLS-PSK (for FD/SD connections — Bareos uses PSK, not certificates)
openssl = "0.10"

# gRPC TLS certificate generation + mDNS service discovery
rcgen = "0.13"
mdns-sd = "0.13"
hex = "0.4"

# Concurrency
crossbeam-channel = "0.5"
flume = "0.11"
dashmap = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OS
nix = { version = "0.29", features = ["process", "signal", "fs", "user", "hostname"] }
libc = "0.2"

# Signal handling
ctrlc = "3"

# Daemonize
daemonize = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "15"

# Python plugins
pyo3 = { version = "0.23", features = ["auto-initialize"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Workspace crates
bareos-bnet = { path = "crates/bareos-bnet" }
bareos-config = { path = "crates/bareos-config" }
bareos-catalog = { path = "crates/bareos-catalog" }
bareos-proto-rs = { path = "crates/bareos-proto-rs" }
