[workspace]
resolver = "2"
members = [
    "crates/bareos-bnet",
    "crates/bareos-config",
    "crates/bareos-catalog",
    "crates/onesimus-proto-rs",
    "crates/odir",
    "crates/oconsole",
    "crates/bareos-orm",
    "crates/osd",
    "crates/osd/daemon",
    "crates/osd/ring",
    "crates/ofd",
    "crates/onesimus-plugins",
    "crates/onesimus-pg-broker",
    "crates/onesimus-ldap-broker",
    "crates/onesimus-podman-core",
    "crates/onesimus-podman-broker",
    "crates/onesimus-rig",
    "crates/bareos-format",
    "crates/daemon-crate",
    "crates/onesimus-bnet-grpc",
    "crates/smartread",
    "crates/outils",
]

[workspace.package]
# <Bareos version this Director is compatible with>+onesimus.<Onesimus (GUI) version>
version = "25.1.2+onesimus.0.2.0"
edition = "2024"
authors = ["Jörg Bernau <contact@onesimus.io>"]
# Voreinstellung des Workspaces; eigene Crates überschreiben sie mit
# "AGPL-3.0-or-later OR LicenseRef-Onesimus-Commercial" (docs/LIZENZEN.md).
license = "AGPL-3.0-or-later"
repository = "https://github.com/Onesimus-io/onesimus-director"

[workspace.dependencies]
# Async runtime (only for gRPC)
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"

# Database
jiff = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }

# Parsing
nom = "7"

# Crypto
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# TLS-PSK (for FD/SD connections — Bareos uses PSK, not certificates)
openssl = "0.10"

# gRPC TLS certificate generation + mDNS service discovery
rcgen = "0.13"
mdns-sd = "0.13"
hex = "0.4"

# Documentation: Mermaid diagrams in rustdoc
aquamarine = "0.6"

# Concurrency
crossbeam-channel = "0.5"
flume = "0.11"
dashmap = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # key order as in C++ (jansson)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OS
nix = { version = "0.29", features = ["process", "signal", "fs", "user", "hostname"] }
libc = "0.2"
memmap2 = "0.9"

# Signal handling
ctrlc = "3"

# Daemonize

# CLI
clap = { version = "4", features = ["derive"] }
# Required for timed prompt refresh: consume buffered terminal input before polling.
# Upstream fix: https://github.com/kkawakam/rustyline/commit/f2bbcc5cdf7b99dfe7d97af03976b111bc6fd256
rustyline = { git = "https://github.com/kkawakam/rustyline.git", rev = "f2bbcc5cdf7b99dfe7d97af03976b111bc6fd256" }

# Error handling
anyhow = "1"
thiserror = "2"

# Workspace crates
bareos-bnet = { path = "crates/bareos-bnet" }
bareos-format = { path = "crates/bareos-format" }
daemon-crate = { path = "crates/daemon-crate" }
onesimus-bnet-grpc = { path = "crates/onesimus-bnet-grpc" }
bareos-config = { path = "crates/bareos-config" }
osd = { path = "crates/osd" }
osd-ring = { path = "crates/osd/ring" }
bareos-catalog = { path = "crates/bareos-catalog" }
onesimus-proto-rs = { path = "crates/onesimus-proto-rs" }
