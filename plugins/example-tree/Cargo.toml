[package]
name = "onesimus-plugin-example-tree"
version = "1.0.0"
edition = "2024"
description = "Test plugin for ofd: a fixed tree of virtual files; online restore keeps checksums in memory"
license = "AGPL-3.0-only"
publish = false

# Built for wasm32-wasip2 on its own, not part of the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.51", default-features = false, features = ["macros"] }
prost = { version = "0.13", default-features = false, features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
