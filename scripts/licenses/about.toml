# cargo-about: Lizenztexte der Rust-Abhängigkeiten für THIRD-PARTY-RUST.txt
# Aufruf: scripts/licenses/make-third-party.sh (siehe dort).
accepted = [
    "AGPL-3.0-or-later", "AGPL-3.0-only",
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "0BSD", "BSL-1.0",
    "MPL-2.0", "OpenSSL", "CDLA-Permissive-2.0",
    # eigene Crates (Pfadabhängigkeiten): werden in der Vorlage nicht aufgeführt
    "LicenseRef-OSSP-var", "LicenseRef-Onesimus-Commercial",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
